<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>计时异形卡定稿参考（A 番茄 / B 怀表 / C 沙漏 / F 月相）—— 实现须与此文件逐笔一致</title>
<style>
  /* 定稿参考页：每版一个 <svg class="art">，data-x 属性标注动态绑定点。
     实现要求：
     1) 形状/渐变/构图逐笔复用本文件 SVG；
     2) 动态绑定点：.arc 进度弧(stroke-dasharray=C, dashoffset=C*(1-rem))、
        .t-time 时间文本、.sand-top/.sand-bot 沙面高度、.gold 完成金罩、.badge 完成徽标；
     3) 状态：running/paused(降饱和 saturate(.55) brightness(.85)+动效停)/done(元素耗尽+badge+gold)；
     4) 操作钮：悬停浮现深色玻璃胶囊（❚❚ 暂停 / ↺ 重置），位于卡底居中。 */
  body { background:#20242e; display:flex; flex-wrap:wrap; gap:40px; padding:40px; }
  figure { text-align:center; }
  figcaption { color:#9aa3b5; font:12px/1.8 Inter,'Microsoft YaHei',sans-serif; margin-top:8px; }
  .rope { width:240px; height:3px; border-radius:2px; margin:0 auto;
    background:linear-gradient(90deg,#a8824c,#dcb87b 30%,#a8824c 60%,#dcb87b 100%); }
  .clip { width:13px; height:24px; border-radius:3px 3px 6px 6px; margin:-1px auto 0;
    background:linear-gradient(180deg,#efe0c0,#c9ac77); border:1px solid rgba(0,0,0,.28); }
  .sway { transform-origin:50% 0; animation:sway 4.6s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:rotate(.8deg)} 50%{transform:rotate(-.8deg)} }
  @keyframes flow { to { stroke-dashoffset:-14; } }
  .stream { animation:flow 1.2s linear infinite; }
</style>
</head>
<body>

<!-- ============ A · 番茄：白瓷表盘 + 红弧=剩余；完成转金(.gold)；C=289 ============ -->

    <clipPath id="tClip"><path d="M109 34 C68 30 30 64 30 120 C30 174 66 208 109 208 C152 208 188 174 188 120 C188 64 150 30 109 34 Z"/></clipPath>
  </defs>
  <path d="M109 34 C68 30 30 64 30 120 C30 174 66 208 109 208 C152 208 188 174 188 120 C188 64 150 30 109 34 Z" fill="url(#tBody)"/>
  <g clip-path="url(#tClip)"><rect class="gold" x="30" y="30" width="158" height="180" fill="url(#tGold)" opacity="0"/></g>
  <ellipse cx="78" cy="72" rx="30" ry="15" fill="#ffffff" opacity=".32" transform="rotate(-16 78 72)"/>
  <path d="M109 34 C104 26 100 20 104 12" stroke="#3e8a4c" stroke-width="5" stroke-linecap="round" fill="none"/>
  <g fill="#3f9e4d">

    <path d="M109 36 C116 24 130 18 142 24 C130 30 116 36 109 42 Z" fill="#2e7d32"/>
  </g>
  <circle cx="109" cy="128" r="54" fill="#fff9f5"/>

    <path d="M180 34 L184.5 38.5 L192.5 29.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

</svg>
</div>
<figcaption>A 番茄 · 表盘弧=剩余 · 完成整果转金</figcaption>
</figure>
