[package]
name = "todobar"
version = "0.4.58"
description = "Right-edge todo sidebar for macOS and Windows"
authors = ["Leonxlnx"]
license = "Apache-2.0"
repository = "https://github.com/Leonxlnx/todobar"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "todobar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
# 录音机:定位「文档」目录(录音仅存本地,不上云)
dirs = "5"
# base64 原本只在 windows 块;录音分片落盘在所有平台编译期都会用到,挪到通用依赖
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

# 截图/贴图功能(仅 Windows 实现;其他平台提供占位命令)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    # OCR(Windows.Media.Ocr):WinRT 命名空间,依赖的 Foundation 系 feature 随引随启
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams"
] }
# 自启动注册表自愈:删除 productName 改名前(Todobar)遗留的 Run 条目
winreg = "0.55"
arboard = "3"
image = "0.25"
# OCR(PP-OCRv4 本地神经网络模型,POC 验证精度显著优于系统引擎):
# onnxruntime 推理;load-dynamic = 运行时加载随包分发的 onnxruntime.dll
# (src-tauri/onnxruntime/,CPU EP,不解码 DirectML 避免多带 34MB GPU 库)
ort = { version = "2.0.0-rc.15", features = ["load-dynamic"] }
# 与 ort 内部同版;用 load_with_flags(DLL_LOAD_DIR) 预载 onnxruntime.dll,
# 修正 ort 默认 flags=0 导致依赖落到 System32 旧版 VC 运行库的问题
libloading = "0.9"

# OCR(macOS):Vision 框架(accurate 档),objc2 系仅在 mac 目标编译;
# API 签名需在 mac 构建机首次编译时校准(方案 §10-R3)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSArray", "NSString"] }
objc2-vision = "0.3"

# ---------------------------------------------------------------------------
# dev profile:依赖(尤其 image / png 编解码)编译为 opt-level 3。
#
# 为什么(2026-10-28):`tauri dev` 默认 dev profile 是 opt-level 0,整屏
# 1920x1080 的 PNG 编码(截图冻结帧)在 debug 下要 600ms~4s,而 release 只要
# 几十毫秒 —— 这就是「开发版按截图键要等 2~4 秒,生产版很快」的真正原因。
# 只给依赖开优化,本项目源码仍为 0 级 → 增量编译依旧很快。
# ---------------------------------------------------------------------------
[profile.dev.package."*"]
opt-level = 3
