<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1d7ef0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Tacco 后台" />
<meta name="format-detection" content="telephone=no" />
<title>Tacco 后台管理 · 手机版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231d7ef0'/><text x='32' y='45' font-size='40' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>T</text></svg>" />
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--line:#e8ecf3;--line2:#f1f4f9;
  --t1:#1e293b;--t2:#64748b;--t3:#94a3b8;
  --primary:#1d7ef0;--primary-d:#1565d8;--primary-l:#eaf3ff;
  --green:#16a34a;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.045);
  --tabh:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-size:14px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.5px}

/* ---------- 布局 ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;display:flex;align-items:center;gap:10px;min-height:52px}
.tb-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3d97f5,#1565d8);color:#fff;
  font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(29,126,240,.28)}
.tb-left{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.tb-title{font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11px;color:var(--t3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-logout{border:1px solid var(--line);background:#fff;color:var(--t2);border-radius:8px;padding:6px 10px;font-size:12px;flex-shrink:0}
.tb-logout:active{background:var(--line2)}
.content{padding:12px 14px calc(var(--tabh) + env(safe-area-inset-bottom) + 28px);max-width:820px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--t3);font-size:10px;position:relative;padding-top:4px}
.tabbar a svg{width:19px;height:19px;flex-shrink:0}
.tabbar a.active{color:var(--primary);font-weight:600}
.tabbar a.active:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2px;border-radius:0 0 2px 2px;background:var(--primary)}
.tabbar .new-dot{position:absolute;top:3px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:8px;
  line-height:1;padding:2px 3px;border-radius:4px;font-weight:700}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-pad{padding:13px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.page-head h1{font-size:19px;margin:0 0 2px;line-height:1.25}
.page-head .sub{font-size:11.5px;color:var(--t3);line-height:1.5}
.section-title{font-size:14px;font-weight:700;margin:18px 0 10px;padding-left:9px;border-left:3px solid var(--primary)}
.card-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.card-title .hint{font-size:11px;color:var(--t3);font-weight:400}
.loading,.empty{text-align:center;color:var(--t3);padding:32px 12px;font-size:13px}
.empty{padding:26px 12px}
.muted{color:var(--t3)}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:#fff;color:var(--t1);border-radius:9px;padding:8px 12px;font-size:13px;
  min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:active{background:var(--line2)}
.btn:disabled,.btn-disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn-primary:active{background:var(--primary-d)}
.btn-danger{color:#dc2626;border-color:#fecaca;background:#fff}
.btn-sm{padding:6px 10px;min-height:34px;font-size:12px;border-radius:8px}
.btn-block{width:100%}
.seg{display:inline-flex;background:#eef2f7;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--t2);border-radius:7px;padding:6px 11px;font-size:12px;min-height:32px}
.seg button.active{background:#fff;color:var(--primary);font-weight:700;box-shadow:0 1px 3px rgba(15,23,42,.1)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select,.field input,.field select,.field textarea{
  border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-size:14px;min-height:40px;outline:none}
.toolbar input[type=search]{flex:1;min-width:150px}
.toolbar input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
.toolbar select{min-width:106px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:12px}
.kpi{padding:12px}
.kpi .label{font-size:11.5px;color:var(--t2);display:flex;align-items:center;gap:6px}
.kpi .value{font-size:23px;font-weight:750;line-height:1.35;margin-top:5px;letter-spacing:-.5px}
.kpi .extra{font-size:10.5px;color:var(--t3);margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.badge{display:inline-flex;align-items:center;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:#e8f7ee;color:#15803d}
.badge-blue{background:#e8f1ff;color:#1d4ed8}
.badge-amber{background:#fff4e0;color:#b45309}
.badge-red{background:#feecec;color:#dc2626}
.badge-slate{background:#f1f4f9;color:#64748b}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 4px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.pager .pager-btns{display:flex;gap:8px}
.list{display:flex;flex-direction:column;gap:9px}
.item-card{padding:12px;position:relative}
.item-top{display:flex;align-items:flex-start;gap:9px}
.item-main{flex:1;min-width:0}
.item-title{font-size:14px;font-weight:650;word-break:break-word;line-height:1.4}
.item-sub{font-size:11.5px;color:var(--t3);margin-top:2px;word-break:break-all}
.item-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--t2)}
.item-meta b{color:var(--t1);font-weight:650}
.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.item-actions .btn{flex:1;min-width:88px}
.avatar{width:34px;height:34px;border-radius:9px;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;
  justify-content:center;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.chart-box{margin-top:6px;overflow:hidden}
.chart-box svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:9px;font-size:11px;color:var(--t2)}
.legend .item{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;flex-shrink:0}
.funnel-row{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px}
.f-label{width:96px;flex-shrink:0;color:var(--t2);font-size:11.5px}
.f-track{flex:1;height:9px;background:#f1f4f9;border-radius:5px;overflow:hidden}
.f-bar{height:100%;border-radius:5px}
.f-val{width:76px;text-align:right;flex-shrink:0;font-size:12px}
.f-val .rate{display:block;font-size:10px;color:var(--t3);font-weight:400}
details.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:12px;color:var(--t2)}
details.note summary{font-weight:650;color:var(--t1);cursor:pointer;font-size:12.5px}
details.note ul{margin:10px 0 2px;padding-left:18px;line-height:1.75}
.kv-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kv-row:last-child{border-bottom:0}
.kv-row .k{color:var(--t2)}
.kv-row .v{font-weight:600;text-align:right;word-break:break-all}
.mon-track{display:inline-block;width:62px;height:6px;background:#eef2f7;border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}
.mon-fill{display:block;height:100%;border-radius:4px}

/* ---------- 浮层 ---------- */
#toast-wrap{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;z-index:90;
  display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;padding:0 14px}
.toast{background:#1e293b;color:#fff;border-radius:10px;padding:10px 14px;font-size:12.5px;max-width:100%;
  box-shadow:0 8px 24px rgba(15,23,42,.25);text-align:center;transition:opacity .3s}
.toast-ok{background:#15803d}.toast-warn{background:#b45309}.toast-err{background:#dc2626}
#sync-chip{position:fixed;top:calc(env(safe-area-inset-top) + 56px);left:50%;transform:translateX(-50%);z-index:40;
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--t2);
  box-shadow:var(--shadow);display:none;align-items:center;gap:6px;white-space:nowrap}
#sync-chip.err{color:#dc2626;border-color:#fecaca}
.spin{width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;
  display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet-mask,.confirm-mask{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.44);display:flex}
.sheet-mask{align-items:flex-end}
.sheet{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 -8px 32px rgba(15,23,42,.18);
  padding-bottom:env(safe-area-inset-bottom);animation:slideUp .22s ease-out}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.sheet-head h3{margin:0;font-size:15.5px;font-weight:700}
.sheet-x{border:0;background:#f1f4f9;color:var(--t2);width:28px;height:28px;border-radius:50%;font-size:15px;line-height:1}
.sheet-body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-foot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:9px;flex-shrink:0}
.sheet-foot .btn{flex:1}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--t2);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:104px;resize:vertical;line-height:1.6}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-tip{font-size:11.5px;color:var(--t3);line-height:1.65;margin-top:8px}
.sheet-item{display:block;width:100%;text-align:left;border:0;background:#f8fafc;border-radius:10px;padding:12px;
  margin-bottom:9px;font-size:14px;font-weight:600}
.sheet-item small{display:block;font-weight:400;color:var(--t3);font-size:11.5px;margin-top:3px}
.sheet-item:active{background:var(--primary-l)}
.code-out{background:#0f1b2d;color:#a5f3c4;border-radius:10px;padding:12px;font-family:ui-monospace,Consolas,monospace;
  font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-all;max-height:44vh;overflow:auto}
.confirm-mask{align-items:center;justify-content:center;padding:24px}
.confirm-box{background:#fff;border-radius:14px;width:100%;max-width:330px;overflow:hidden;box-shadow:0 12px 40px rgba(15,23,42,.25)}
.confirm-msg{padding:20px 18px;font-size:14px;line-height:1.65;text-align:center;white-space:pre-wrap}
.confirm-actions{display:flex;border-top:1px solid var(--line)}
.confirm-actions .btn{flex:1;border:0;border-radius:0;min-height:46px;font-size:14px}
.confirm-actions .btn+.btn{border-left:1px solid var(--line)}
.confirm-actions .yes{color:var(--primary);font-weight:650}
.confirm-actions .yes.danger{color:#dc2626}
.chart-tip{position:fixed;z-index:80;display:none;background:rgba(15,23,42,.94);color:#fff;border-radius:8px;
  padding:7px 10px;font-size:11.5px;line-height:1.6;pointer-events:none;max-width:230px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.chart-tip b{color:#fff}
.bulk-bar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);z-index:35;
  background:#1e293b;color:#fff;border-radius:12px;padding:9px 11px;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 26px rgba(15,23,42,.3);font-size:12px}
.bulk-bar .cnt{flex:1;white-space:nowrap}
.bulk-bar .btn{min-height:34px;padding:5px 10px;font-size:12px}
.reply-line{background:#f8fafc;border-radius:9px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.reply-line .t{display:block;font-size:10.5px;color:var(--t3);margin-bottom:2px}
.origin-box{background:var(--primary-l);border-radius:9px;padding:10px;font-size:13px;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.mon-banner{display:flex;align-items:flex-start;gap:10px;border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid}
.mon-banner svg{flex-shrink:0;margin-top:1px}
.mon-banner.ok{background:#eefaf2;border-color:#c7ecd6;color:#15803d}
.mon-banner.warn{background:#fff8ea;border-color:#fde3b0;color:#b45309}
.mon-banner.crit{background:#fef1f1;border-color:#fecaca;color:#dc2626}
.b-title{display:block;font-weight:700;font-size:13.5px}
.b-sub{display:block;font-size:11.5px;opacity:.9;margin-top:2px;line-height:1.5}
.mon-kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:12px}
.mon-kpi{padding:11px;display:flex;align-items:center;gap:9px}
.mon-kpi svg{width:54px;height:54px;flex-shrink:0}
.mon-kpi .label{font-size:11px;color:var(--t2)}
.mon-kpi .value{font-size:14px;font-weight:700;margin:2px 0;line-height:1.3}
.mon-kpi .value small{font-size:10.5px;color:var(--t3);font-weight:400}
.mon-kpi .extra{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:10.5px;color:var(--t3)}
.mon-rule{font-size:12px;color:var(--t2);padding:7px 0;border-bottom:1px dashed var(--line);line-height:1.6}
.mon-rule:last-child{border-bottom:0}
.mon-rule .k{font-weight:700;margin-right:6px}
.mon-hero{background:#fef1f1;border:1px solid #fecaca;border-radius:10px;padding:12px;margin-bottom:12px}
.mon-hero .t{font-weight:700;color:#dc2626;font-size:14px}
.mon-hero .d{font-size:12px;color:#7f1d1d;line-height:1.65;margin-top:4px}
.mon-alert-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.mon-alert-row .v{font-weight:700;color:#dc2626;text-align:right}
.mon-note{background:#f8fafc;border-radius:10px;padding:11px;font-size:12px;color:var(--t2);line-height:1.8;margin-top:12px}
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(150deg,#eaf3ff 0%,#f4f6fa 48%,#e8f0ff 100%)}
.login-card{width:100%;max-width:360px;padding:26px 20px;border-radius:18px;box-shadow:0 12px 40px rgba(29,126,240,.13)}
.login-logo{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#3d97f5,#1565d8);color:#fff;
  font-weight:800;font-size:27px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
  box-shadow:0 6px 18px rgba(29,126,240,.3)}
.login h1{text-align:center;font-size:19px;margin:0 0 4px}
.login .tip{text-align:center;font-size:11px;color:var(--t3);margin:16px 0 0;line-height:1.8}
.login .btn-primary{margin-top:6px;min-height:44px;font-size:15px}
@media(min-width:600px){.content{padding-left:20px;padding-right:20px}.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

<body>
<div id="app"></div>
<div id="toast-wrap"></div>
<div id="sync-chip"></div>
<div id="tip" class="chart-tip"></div>
<script>
"use strict";
/* =====================================================================
   Tacco 后台管理 · 手机版（独立单文件，零 CDN、零构建）
   与 PC 端 release/admin/index.html 共用同一套 /api/admin/* 接口与管理员会话。
   本文件不引用、不修改 PC 端任何资源。
   ===================================================================== */
const TOKEN_KEY = 'ticktask-admin-token'
// 「记住账号密码」:仅在用户主动勾选时明文保存于本机浏览器;退出登录不清除。与 PC 端共用同一 key。
const REMEMBER_KEY = 'ticktask-admin-remember'
function readRemember() {
  try {
    const v = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null')
    return v && typeof v === 'object' ? v : null
  } catch { return null }
}
function writeRemember(on, email, password) {
  try {
    if (on) localStorage.setItem(REMEMBER_KEY, JSON.stringify({ on: true, email, password }))
    else localStorage.removeItem(REMEMBER_KEY)
  } catch { /* 隐私模式忽略 */ }
}
const CACHE_PREFIX = 'admin_h5_cache_v1:'
const MON_ALERT_KEY = 'ticktask-h5-usage-alert-shown'

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]))
}
function fmt(n) { n = Number(n) || 0; return n.toLocaleString('zh-CN') }
function fmtTime(iso) {
  if (!iso) return '—'
  const d = new Date(iso)
  if (isNaN(d.getTime())) return String(iso)
  const p = (x) => String(x).padStart(2, '0')
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`
}
function fmtDay(day) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(day || ''))
  return m ? `${m[2]}-${m[3]}` : String(day || '')
}
function fmtAgo(iso) {
  if (!iso) return '从未'
  const t = new Date(iso).getTime()
  if (isNaN(t)) return '—'
  const diff = Date.now() - t
  if (diff < 60_000) return '刚刚'
  if (diff < 3_600_000) return Math.floor(diff / 60_000) + ' 分钟前'
  if (diff < 86_400_000) return Math.floor(diff / 3_600_000) + ' 小时前'
  if (diff < 30 * 86_400_000) return Math.floor(diff / 86_400_000) + ' 天前'
  return fmtTime(iso).slice(0, 10)

// ---------- API / 本地缓存 ----------
async function api(path, opts = {}) {
  const headers = Object.assign({ 'content-type': 'application/json' }, opts.headers || {})
  const token = localStorage.getItem(TOKEN_KEY)
  if (token) headers['X-Admin-Token'] = token
  let res
  try { res = await fetch(path, Object.assign({}, opts, { headers })) }
  catch (e) { throw new Error('网络请求失败,请检查连接') }
  if (res.status === 401 && path.indexOf('/api/admin/login') < 0) {
    localStorage.removeItem(TOKEN_KEY)
    location.hash = '#/login'
    toast('登录已过期,请重新登录', 'err')
    throw new Error('未授权')
  }
  let data = {}
  try { data = await res.json() } catch { /* 非 JSON */ }
  if (!res.ok) throw new Error(data.error || ('请求失败 HTTP ' + res.status))
  return data
}
function cacheGet(key) {
  try {
    const v = JSON.parse(localStorage.getItem(CACHE_PREFIX + key))
    return v && typeof v === 'object' && 'data' in v && 'ts' in v ? v : null
  } catch { return null }
}
function cacheSet(key, data) {
  try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ ts: Date.now(), data })) } catch { /* 容量满 */ }
}
function cacheClearAll() {
  try {
    Object.keys(localStorage).filter((k) => k.indexOf(CACHE_PREFIX) === 0).forEach((k) => localStorage.removeItem(k))
  } catch { /* ignore */ }
}

function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text))
    } else fallbackCopy(text)
  } catch { fallbackCopy(text) }
}

  ta.style.position = 'fixed'; ta.style.opacity = '0'
  document.body.appendChild(ta); ta.select()
  try { document.execCommand('copy') } catch { /* 忽略 */ }
  ta.remove()

const CHART_COLORS = ['#1d7ef0', '#f59e0b', '#16a34a', '#8b5cf6', '#ef4444', '#06b6d4']
function chartW() {
  const v = document.getElementById('view')
  const w = (v ? v.clientWidth : 375) - 54

}
function niceTicks(max, count = 4) {
  if (max <= 0) return [0, 1]
  const raw = max / count
  const mag = Math.pow(10, Math.floor(Math.log10(raw)))
  const norm = raw / mag
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag

  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step)

}
function lineChartSvg(labels, series, opts = {}) {
  const W = opts.w || chartW(), H = opts.height || 220

  const iw = W - padL - padR, ih = H - padT - padB

  const ticks = niceTicks(maxV), top = ticks[ticks.length - 1]
  const x = (i) => padL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw)
  const y = (v) => padT + ih - (v / top) * ih

  if (hasBars) {
    const bt = niceTicks(Math.max(1, ...opts.bars.data))
    barTop = bt[bt.length - 1]
    yBar = (v) => padT + ih - (v / barTop) * ih

  }
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img">`
  if (hasBars) {
    const bw = n > 0 ? Math.max(2, Math.min(16, (iw / Math.max(n, 1)) * 0.5)) : 2
    opts.bars.data.forEach((v, i) => {
      if (!(v > 0)) return
      const bh = Math.max(1.5, padT + ih - yBar(v))
      out += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${yBar(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${opts.bars.color}" opacity="0.55"/>`
    })
  }
  for (const t of ticks) {
    const yy = y(t)
    out += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="#eef1f6" stroke-width="1"/>`

  }
  if (hasBars) for (const t of barTicks) {
    out += `<text x="${W - padR + 5}" y="${(yBar(t) + 4).toFixed(1)}" text-anchor="start" font-size="10" fill="#94a3b8">${t >= 1000 ? (t / 1000) + 'k' : t}</text>`

  const stepX = Math.max(1, Math.ceil(n / 6))

    out += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#94a3b8">${esc(labels[i])}</text>`
  }
  if (n > 1) out += `<text x="${x(n - 1)}" y="${H - 6}" text-anchor="end" font-size="10" fill="#94a3b8">${esc(labels[n - 1])}</text>`
  series.forEach((s) => {
    const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`)
    if (s.area) out += `<polygon points="${padL},${padT + ih} ${pts.join(' ')} ${x(n - 1).toFixed(1)},${padT + ih}" fill="${s.color}" opacity="0.10"/>`
    out += `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`
    if (n <= 40) s.data.forEach((v, i) => {
      out += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.4" fill="#fff" stroke="${s.color}" stroke-width="1.5"/>`
    })
  })
  const hitW = Math.max(12, n > 1 ? iw / (n - 1) : iw)
  for (let i = 0; i < n; i++) {
    const x0 = n > 1 ? Math.max(padL, x(i) - hitW / 2) : padL
    let tipHtml = `<b>${esc(labels[i])}</b>` + series.map((s) => `<br><span class="sw" style="background:${s.color}"></span>${esc(s.name)}:${fmt(s.data[i])}`).join('')
    if (hasBars) tipHtml += `<br><span class="sw" style="background:${opts.bars.color}"></span>${esc(opts.bars.name)}:${fmt(opts.bars.data[i])}`
    out += `<rect x="${x0.toFixed(1)}" y="${padT}" width="${hitW.toFixed(1)}" height="${ih}" fill="transparent" data-tip="${esc(tipHtml)}"/>`
  }

}
function barChartSvg(labels, data, color, opts = {}) {
  const W = opts.w || chartW(), H = opts.height || 210
  const padL = 40, padR = 12, padT = 12, padB = 24
  const iw = W - padL - padR, ih = H - padT - padB, n = labels.length
  const ticks = niceTicks(Math.max(1, ...data)), top = ticks[ticks.length - 1]
  const y = (v) => padT + ih - (v / top) * ih
  const bw = n > 0 ? Math.max(2, (iw / n) * 0.62) : 2
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img">`
  for (const t of ticks) {
    const yy = y(t)
    out += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="#eef1f6"/>`
    out += `<text x="${padL - 6}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#94a3b8">${t >= 1000 ? (t / 1000) + 'k' : t}</text>`
  }
  const stepX = Math.max(1, Math.ceil(n / 6)), gapPx = n > 1 ? iw / (n - 1) : iw
  data.forEach((v, i) => {
    const cx = padL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw)
    const bh = Math.max(v > 0 ? 2 : 0, padT + ih - y(v))
    const tipHtml = `<b>${esc(labels[i])}</b><br>数量:${fmt(v)}`
    out += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${color}" data-tip="${esc(tipHtml)}"></rect>`
    if (i % stepX === 0 && (n - 1 - i) * gapPx >= 40) out += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#94a3b8">${esc(labels[i])}</text>`
  })
  if (n > 1) out += `<text x="${padL + iw}" y="${H - 6}" text-anchor="end" font-size="10" fill="#94a3b8">${esc(labels[n - 1])}</text>`

function donutChartSvg(items, opts = {}) {
  const size = 180, r = 68, cx = size / 2, cy = size / 2, sw = 24
  const total = items.reduce((s, it) => s + (Number(it.value) || 0), 0)
  const C = 2 * Math.PI * r
  let out = `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:100%;height:auto;display:block;margin:0 auto" role="img">`
  out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef1f6" stroke-width="${sw}"/>`
  let offset = 0
  if (total > 0) for (const it of items) {
    const v = Number(it.value) || 0
    if (v <= 0) continue
    const frac = v / total, len = Math.max(0, frac * C - 2.5)
    const tipHtml = `<b>${esc(it.label)}</b><br>数量:${fmt(v)} · 占比 ${(frac * 100).toFixed(1)}%`
    out += `<circle class="donut-seg" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${sw}"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-offset * C).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"
      data-val="${fmt(v)}" data-label="${esc(it.label)}" data-pct="${(frac * 100).toFixed(1)}" data-tip="${esc(tipHtml)}"></circle>`
    offset += frac
  }
  out += `<text class="donut-cv" x="${cx}" y="${cy - 3}" text-anchor="middle" font-size="23" font-weight="700" fill="#1e293b">${fmt(total)}</text>`
  out += `<text class="donut-cl" x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="11" fill="#94a3b8">${esc(opts.centerLabel || '总用户')}</text>`
  return out + '</svg>'
}
// 点击/触摸图表元素显示数值浮层（PC 端用 mousemove，移动端无 hover）
const tipEl = document.getElementById('tip')
let tipSeg = null
function donutSwap(seg) {
  const svg = seg.closest('svg')

  const v = svg.querySelector('.donut-cv'), l = svg.querySelector('.donut-cl')
  if (!v || !l) return
  svg.dataset.origV = v.textContent; svg.dataset.origL = l.textContent
  v.textContent = seg.dataset.val
  l.textContent = seg.dataset.label + ' ' + seg.dataset.pct + '%'
}
function donutRestore(seg) {

  if (!svg || svg.dataset.origV == null) return
  const v = svg.querySelector('.donut-cv'), l = svg.querySelector('.donut-cl')
  if (v) v.textContent = svg.dataset.origV
  if (l) l.textContent = svg.dataset.origL
  delete svg.dataset.origV
}
document.addEventListener('click', (e) => {
  const t = e.target instanceof Element ? e.target.closest('[data-tip]') : null
  if (!t) { tipEl.style.display = 'none'; donutRestore(tipSeg); tipSeg = null; return }
  tipEl.innerHTML = t.getAttribute('data-tip')
  tipEl.style.display = 'block'
  const r = t.getBoundingClientRect(), tr = tipEl.getBoundingClientRect()
  let left = r.left + r.width / 2 - tr.width / 2
  left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8))
  let top = r.top - tr.height - 8
  if (top < 8) top = Math.min(window.innerHeight - tr.height - 8, r.bottom + 8)
  tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px'
  const seg = t.classList.contains('donut-seg') ? t : null
  if (seg !== tipSeg) { donutRestore(tipSeg); if (seg) donutSwap(seg); tipSeg = seg }
}, true)

// 需要在趋势图与明细中固定关注的四个工具。
// pages = 页面访问埋点(page_visit),entries = 顶栏入口点击(feature_click)。
// 剪贴板 / 便利签是独立窗口,客户端目前只有入口点击、没有 page_visit。
const FOCUS_TOOLS = [
  { name: '日历（万年历 / 黄历）', pages: ['huangli'], entries: ['topbar:huangli'] },
  { name: '计算器', pages: ['calculator'], entries: ['topbar:calculator'] },
  { name: '剪贴板', pages: ['clipboard'], entries: ['topbar:clipboard'] },
  { name: '便利签', pages: ['note'], entries: ['topbar:note'] },
]
function focusIds() {
  const s = new Set()
  FOCUS_TOOLS.forEach((t) => { t.pages.forEach((x) => s.add(x)); t.entries.forEach((x) => s.add(x)) })
  return s
}
function buildFocusToolsSection(data) {
  const pages = (data.app && data.app.pages) || []
  const by = new Map(pages.map((p) => [p.page, p]))
  const rows = FOCUS_TOOLS.map((t) => {
    const visitors = t.pages.reduce((s, id) => s + (by.get(id)?.visitors || 0), 0)
    const clicks = t.entries.reduce((s, id) => s + (by.get(id)?.clicks || 0), 0)
    const tracked = t.pages.some((id) => by.has(id))
    return `<div class="kv-row" style="display:block">
      <div style="display:flex;justify-content:space-between;gap:8px"><span class="k">${esc(t.name)}</span><span class="v num">${fmt(visitors)} 访客 · ${fmt(clicks)} 入口点击</span></div>
      ${tracked ? '' : '<div style="font-size:10.5px;color:var(--t3);margin-top:3px">独立窗口，客户端暂未上报页面访问，访客显示为 0</div>'}
    </div>`
  }).join('')
  return `<div class="card card-pad" style="margin-bottom:10px">
    <div class="card-title">重点工具访问统计 <span class="hint">近 ${data.days} 天</span></div>

    <div style="font-size:10.5px;color:var(--t3);margin-top:8px">访客按设备去重，入口点击为次数。日历对应「黄历 / 万年历」页面；剪贴板、便利签为独立窗口，目前只统计顶栏入口点击。</div>
  </div>`
}

async function loadOverview(force) {

function buildAppStatsSection(data) {
  const dayList = (data.app && data.app.days) || []
  const labels = dayList.map(fmtDay)
  const allPages = (data.app && data.app.pages) || []
  // 趋势图:访客 Top 6 + 四个重点工具(即使访客为 0 也纳入,便于持续观察)
  const focus = focusIds()
  const topPages = allPages.slice(0, 6).slice()
  for (const p of allPages) {
    if (topPages.length >= 10) break
    if (focus.has(p.page) && !topPages.some((x) => x.page === p.page)) topPages.push(p)
  }
  const dayPage = new Map()
  for (const p of ((data.app && data.app.trend) || [])) {
    if (!dayPage.has(p.page)) dayPage.set(p.page, new Map())
    dayPage.get(p.page).set(p.day, p.visitors)
  }
  const pageSeries = topPages.map((p, i) => ({
    name: pageLabel(p.page), color: CHART_COLORS[i % CHART_COLORS.length],
    data: dayList.map((d) => dayPage.get(p.page)?.get(d) ?? 0),
    total: p.visitors,
  }))
  const totalV = allPages.reduce((s, p) => s + p.visitors, 0)
  const totalC = allPages.reduce((s, p) => s + p.clicks, 0)
  return `<div class="kpi-grid">
    <div class="card kpi"><div class="label"><span class="dot" style="background:#16a34a"></span>工具内页面访问</div><div class="value num">${fmt(totalV)}</div><div class="extra">近${data.days}天各页面独立设备数合计</div></div>
    <div class="card kpi"><div class="label"><span class="dot" style="background:#f59e0b"></span>功能点击</div><div class="value num">${fmt(totalC)}</div><div class="extra">App 内功能点击次数合计</div></div></div>
  ${buildFocusToolsSection(data)}
  <div class="card card-pad" style="margin-bottom:10px"><div class="card-title">工具内页面访客趋势 <span class="hint">Top 6 + 重点工具 · 共 ${pageSeries.length} 条</span></div>
    <div class="chart-box">${pageSeries.length ? lineChartSvg(labels, pageSeries, { w: chartW(), height: 210 }) : '<div class="empty">暂无数据</div>'}</div>
    <div class="legend">${pageSeries.map((s) => `<span class="item"><span class="sw" style="background:${s.color}"></span>${esc(s.name)} ${fmt(s.total)}</span>`).join('')}</div></div>
  <div class="card card-pad"><div class="card-title">页面明细</div>
    ${allPages.map((p) => `<div class="kv-row"><span class="k">${esc(pageLabel(p.page))}</span><span class="v num">${fmt(p.visitors)} 访客 · ${fmt(p.clicks)} 点击</span></div>`).join('') || '<div class="empty">暂无数据</div>'}</div>`
}

}

// ---------- 激活码导出：零依赖 .xlsx 生成器（与 PC 端同一实现） ----------
const EXPORT_HEADERS = ['激活码', '批次', '备注', '状态', '使用者', '发放时间', '使用时间', '创建时间']
const EXPORT_COL_WIDTHS = [20, 14, 32, 10, 26, 18, 18, 18]
const CODE_STATUS_LABEL = { unissued: '未发放', issued: '已发放', used: '已使用' }
const EXPORT_PAGE_SIZE = 200
const EXPORT_MAX = 20000
const CRC_TABLE = (() => {
  const t = new Uint32Array(256)
  for (let n = 0; n < 256; n++) {
    let c = n
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1
    t[n] = c >>> 0
  }
  return t
})()
function crc32(bytes) {
  let c = 0xFFFFFFFF
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8)
  return (c ^ 0xFFFFFFFF) >>> 0
}
function zipStore(files) {
  const enc = new TextEncoder(), parts = [], central = []
  const d = new Date()
  const dosTime = ((d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2)) & 0xFFFF
  const dosDate = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF
  let offset = 0
  for (const f of files) {
    const nameBytes = enc.encode(f.name)
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data
    const crc = crc32(data)
    const local = new Uint8Array(30 + nameBytes.length), lv = new DataView(local.buffer)
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true)
    lv.setUint16(8, 0, true); lv.setUint16(10, dosTime, true); lv.setUint16(12, dosDate, true)
    lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true)
    lv.setUint16(26, nameBytes.length, true); lv.setUint16(28, 0, true)
    local.set(nameBytes, 30)
    parts.push(local, data)
    const cen = new Uint8Array(46 + nameBytes.length), cv = new DataView(cen.buffer)
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true)
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, dosTime, true)
    cv.setUint16(14, dosDate, true); cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true)
    cv.setUint32(24, data.length, true); cv.setUint16(28, nameBytes.length, true)
    cv.setUint16(30, 0, true); cv.setUint16(32, 0, true); cv.setUint16(34, 0, true)
    cv.setUint32(38, 0, true); cv.setUint32(42, offset, true)
    cen.set(nameBytes, 46)
    central.push(cen)
    offset += local.length + data.length
  }
  const centralSize = central.reduce((s, c) => s + c.length, 0)
  const end = new Uint8Array(22), ev = new DataView(end.buffer)
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true)
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true)
  ev.setUint32(12, centralSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true)
  const all = parts.concat(central, [end])
  const total = all.reduce((s, a) => s + a.length, 0)
  const out = new Uint8Array(total)
  let p = 0
  for (const a of all) { out.set(a, p); p += a.length }
  return out
}
function xmlEsc(v) {
  return String(v == null ? '' : v)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
}
function colName(n) {
  let s = ''
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26) }
  return s
}
function sheetXml(rows) {
  const cols = EXPORT_HEADERS.length
  const colsXml = EXPORT_COL_WIDTHS.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')
  const cell = (v, ref, s) => {
    const t = v == null ? '' : String(v)
    if (t === '') return `<c r="${ref}"${s ? ` s="${s}"` : ''}/>`
    return `<c r="${ref}"${s ? ` s="${s}"` : ''} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(t)}</t></is></c>`
  }
  const head = `<row r="1" ht="20" customHeight="1">${EXPORT_HEADERS.map((h, i) => cell(h, colName(i + 1) + '1', 1)).join('')}</row>`
  const body = rows.map((row, ri) => {
    const r = ri + 2
    return `<row r="${r}">${row.map((v, ci) => cell(v, colName(ci + 1) + r, 0)).join('')}</row>`
  }).join('')
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
    `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` +
    `<sheetFormatPr defaultRowHeight="16"/><cols>${colsXml}</cols>` +
    `<sheetData>${head}${body}</sheetData>` +
    `<autoFilter ref="A1:${colName(cols)}${rows.length + 1}"/></worksheet>`
}
function buildXlsx(codes) {

    c.user_email || '', c.issued_at ? fmtTime(c.issued_at) : '',
    c.used_at ? fmtTime(c.used_at) : '', c.created_at ? fmtTime(c.created_at) : '',
  ])
  const files = [
    { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="激活码" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="等线"/></font><font><b/><sz val="11"/><name val="等线"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF2F4F8"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf></cellXfs><cellStyles count="1"><cellStyle name="常规" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
    { name: 'xl/worksheets/sheet1.xml', data: sheetXml(rows) },
  ]
  return new Blob([zipStore(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob)

}

const codesState = { q: '', status: '', page: 1, pageSize: 20, total: 0, selected: new Set() }
async function fetchAllCodes(expected, onProgress) {
  const rows = [], pages = Math.max(1, Math.ceil(expected / EXPORT_PAGE_SIZE)), CONCURRENCY = 3
  const fetchPage = async (p) => {
    const qs = new URLSearchParams({ q: codesState.q, status: codesState.status, page: p, pageSize: EXPORT_PAGE_SIZE })
    const data = await api('/api/admin/codes?' + qs.toString())
    return data.rows || []
  }
  let error = ''
  for (let start = 1; start <= pages; start += CONCURRENCY) {
    const batch = []
    for (let p = start; p < start + CONCURRENCY && p <= pages; p++) batch.push(p)
    const settled = await Promise.allSettled(batch.map(fetchPage))
    for (const r of settled) {
      if (r.status === 'fulfilled') { for (const row of r.value) rows.push(row) }
      else if (!error) error = (r.reason && r.reason.message) || '数据拉取失败'
    }
    if (onProgress) onProgress(Math.min(99, Math.round((rows.length / expected) * 100)))
    if (error) return { rows, error }
    if (rows.length >= expected) break
  }
  return { rows, error: '' }
}

async function bulkCodes(op) {
  const codes = Array.from(codesState.selected).filter((c) => c)

  if (op === 'delete' && !(await confirmAsync(`确定删除选中的 ${codes.length} 个激活码?`, '删除', true))) return
  try {
    let done = 0
    for (let i = 0; i < codes.length; i += 500) {
      const part = codes.slice(i, i + 500)
      const d = await api('/api/admin/codes/' + op, { method: 'POST', body: JSON.stringify({ codes: part }) })
      done += Number(d.issued || d.deleted || 0)
    }
    toast((op === 'issue' ? '已发放' : '已删除') + ` ${done} 个`)
    codesState.selected.clear(); loadCodes()
  } catch (e) { toast(e.message, 'err') }
}

    b.onclick = () => { closeSheet(); exportCodes(b.dataset.kind) }
  })
}
async function exportCodes(kind) {
  if (exporting) return
  const btn = document.getElementById('c-export')
  const setLabel = (t) => { if (btn) btn.textContent = t }
  const expected = Number(codesState.total) || 0
  if (expected <= 0) { toast('当前筛选下没有可导出的数据', 'warn', 3200); return }
  if (expected > EXPORT_MAX) { toast(`数据量过大（共 ${fmt(expected)} 条，上限 ${fmt(EXPORT_MAX)}），请缩小筛选范围`, 'err', 4600); return }
  exporting = true
  if (btn) btn.disabled = true
  setLabel('导出中 0%')
  let rows = [], reason = ''
  const fetched = await fetchAllCodes(expected, (pct) => setLabel('导出中 ' + pct + '%'))
  rows = fetched.rows; reason = fetched.error
  if (reason === '未授权') { exporting = false; return }
  if (!reason && rows.length < expected) reason = '数据可能已变动，请刷新后重试'
  let written = 0
  if (rows.length) {
    setLabel('正在生成…')
    try {
      const stamp = stampNow(), suffix = CODE_STATUS_LABEL[codesState.status] || '全部'
      if (kind === 'xlsx') downloadBlob(buildXlsx(rows), `激活码_${suffix}_${stamp}.xlsx`)
      else downloadBlob(new Blob([rows.map((r) => String(r.code || '')).join('\r\n') + '\r\n'], { type: 'text/plain;charset=utf-8' }), `激活码_${suffix}_${stamp}.txt`)
      written = rows.length
    } catch (e) { reason = (e && e.message) || '文件生成失败' }
  }
  const total = Math.max(expected, written), fail = Math.max(0, total - written)
  const tail = reason ? '\n原因：' + reason : ''
  if (written > 0 && fail === 0) toast(`导出成功：共 ${fmt(total)} 条，成功 ${fmt(written)} 条，失败 0 条`, 'ok', 4200)
  else if (written > 0) toast(`导出完成：共 ${fmt(total)} 条，成功 ${fmt(written)} 条，失败 ${fmt(fail)} 条` + tail, 'warn', 4800)
  else toast(`导出失败：共 ${fmt(total)} 条，成功 0 条，失败 ${fmt(total)} 条` + tail, 'err', 5000)
  exporting = false
  if (btn) { btn.disabled = false; setLabel('导出') }
}

const MON_DEFS = [
  { key: 'requests', name: 'Workers 请求 / 天', color: '#1d7ef0' },
  { key: 'rowsRead', name: 'D1 读取行数 / 天', color: '#f59e0b' },
  { key: 'rowsWritten', name: 'D1 写入行数 / 天', color: '#8b5cf6' },
  { key: 'storageBytes', name: 'D1 存储（账户累计）', color: '#16a34a' },
]
const MON_OK_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>'
const MON_WARN_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L2 20h20L12 3z"/><path d="M12 9v5"/><circle cx="12" cy="17.3" r=".8" fill="currentColor" stroke="none"/></svg>'
const MON_LEVEL_TXT = ['正常', '注意', '严重']
const MON_LEVEL_BADGE = ['badge-green', 'badge-amber', 'badge-red']
const MON_LEVEL_COLOR = ['#16a34a', '#d97706', '#dc2626']
const monState = { data: null, filter: 'all', loading: false, timer: null, lastAt: null }
function monNum(n) { return Math.round(Number(n) || 0).toLocaleString('en-US') }
function monBytes(b) { b = Number(b) || 0; return b >= 1024 ** 3 ? (b / 1024 ** 3).toFixed(2) + ' GB' : (b / 1024 ** 2).toFixed(2) + ' MB' }
function monPct(r) { r = Number(r) || 0; return (r * 100).toFixed(r > 0 && r < 0.01 ? 2 : 1) + '%' }
function monLevel(r) { return r >= 0.8 ? 2 : r >= 0.5 ? 1 : 0 }
function monFmt(key, v) { return key === 'storageBytes' ? monBytes(v) : monNum(v) + (key === 'requests' ? ' 次' : ' 行') }
function monLimit(key, v) { return key === 'storageBytes' ? '5 GB' : monNum(v) }
function monBjTime(d) {
  const t = new Date(d.getTime() + 8 * 3600_000), p = (n) => String(n).padStart(2, '0')
  return `${t.getUTCFullYear()}-${p(t.getUTCMonth() + 1)}-${p(t.getUTCDate())} ${p(t.getUTCHours())}:${p(t.getUTCMinutes())}:${p(t.getUTCSeconds())}`
}
function monRing(r, color) {
  const R = 27, C = 2 * Math.PI * R, p = Math.min(1, Math.max(0, r))
  return `<svg viewBox="0 0 66 66" role="img"><circle cx="33" cy="33" r="${R}" fill="none" stroke="#eef2f7" stroke-width="7"/>
    <circle cx="33" cy="33" r="${R}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - p)).toFixed(1)}" transform="rotate(-90 33 33)"/>
    <text x="33" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="${color}">${(p * 100).toFixed(p > 0 && p < 0.01 ? 2 : 0)}%</text></svg>`
}
function monRenderBanner(data) {

  if (!el) return
  el.className = 'mon-banner ' + (lv === 2 ? 'crit' : lv === 1 ? 'warn' : 'ok')
  el.innerHTML = (lv === 0 ? MON_OK_ICON : MON_WARN_ICON) +
    `<div><span class="b-title">${lv === 0 ? '服务运行正常' : lv === 1 ? '存在接近限额的指标' : '服务额度告警'}</span>
    <span class="b-sub">${lv === 0 ? '四项指标均低于日额度 50%，配额不影响用户使用。' : esc(hits.map((m) => m.name + ' ' + monPct(m.ratio)).join(' · ')) + (lv === 2 ? ' · 已自动触发告警' : '')}</span></div>`
}
function monRenderKpis(data) {

}
function monTrendSvg(data) {
  const labels = data.days.map((d) => String(d).slice(5))
  const shown = monState.filter === 'all' ? MON_DEFS : MON_DEFS.filter((d) => d.key === monState.filter)
  const W = chartW(), H = 220, padL = 36, padR = 12, padT = 12, padB = 26
  const iw = W - padL - padR, ih = H - padT - padB, n = labels.length
  const y = (v) => padT + ih - (v / 100) * ih
  const x = (i) => padL + (n > 1 ? (iw * i) / (n - 1) : 0)
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img">`
  ;[0, 20, 40, 60, 80, 100].forEach((t) => {
    out += `<line x1="${padL}" y1="${y(t)}" x2="${W - padR}" y2="${y(t)}" stroke="#eef1f6"/>`
    out += `<text x="${padL - 5}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="#94a3b8">${t}%</text>`
  })
  out += `<line x1="${padL}" y1="${y(50)}" x2="${W - padR}" y2="${y(50)}" stroke="#d97706" stroke-width="1.2" stroke-dasharray="5 4" opacity=".8"/>`
  out += `<text x="${W - padR - 2}" y="${y(50) - 5}" text-anchor="end" font-size="9.5" fill="#d97706">注意线 50%</text>`
  out += `<line x1="${padL}" y1="${y(80)}" x2="${W - padR}" y2="${y(80)}" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 4" opacity=".85"/>`
  out += `<text x="${W - padR - 2}" y="${y(80) - 5}" text-anchor="end" font-size="9.5" fill="#dc2626">告警线 80%</text>`
  const stepX = Math.max(1, Math.ceil(n / 6))
  labels.forEach((d, i) => { if (i % stepX === 0 || i === n - 1) out += `<text x="${x(i)}" y="${H - 7}" text-anchor="middle" font-size="9.5" fill="#94a3b8">${esc(d)}</text>` })
  shown.forEach((def) => {
    const arr = data.series[def.key] || []
    const ratios = labels.map((_, i) => (Number(arr[i]) || 0) / (Number(data.limits[def.key]) || 1))
    const pts = ratios.map((r, i) => `${x(i).toFixed(1)},${y(Math.min(100, r * 100)).toFixed(1)}`)
    out += `<polyline points="${pts.join(' ')}" fill="none" stroke="${def.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`
    ratios.forEach((r, i) => {
      const tipHtml = `<b>${esc(data.days[i])}</b><br><span class="sw" style="background:${def.color}"></span>${esc(def.name)}:${monPct(r)}`
      out += `<circle cx="${x(i).toFixed(1)}" cy="${y(Math.min(100, r * 100)).toFixed(1)}" r="4" fill="#fff" stroke="${def.color}" stroke-width="1.7" data-tip="${esc(tipHtml)}"></circle>`
    })
  })
  return out + '</svg>'
}
function monBarSvg(data) {
  const vals = (data.series.rowsRead || []).map((v) => Number(v) || 0)
  const labels = data.days.map((d) => String(d).slice(5))
  const peak = Math.max.apply(null, vals.concat([0]))
  const top = Math.max(3_000_000, Math.ceil(peak / 1_000_000) * 1_000_000)
  const W = chartW(), H = 210, padL = 42, padR = 10, padT = 14, padB = 26
  const iw = W - padL - padR, ih = H - padT - padB
  const y = (v) => padT + ih - (Math.min(v, top) / top) * ih
  const bw = (iw / Math.max(1, vals.length)) * 0.56
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img">`
  ;[0, 0.25, 0.5, 0.75, 1].forEach((f) => {
    const t = top * f
    out += `<line x1="${padL}" y1="${y(t)}" x2="${W - padR}" y2="${y(t)}" stroke="#eef1f6"/>`
    out += `<text x="${padL - 5}" y="${y(t) + 4}" text-anchor="end" font-size="9.5" fill="#94a3b8">${t === 0 ? '0' : (t / 1_000_000).toFixed(1) + 'M'}</text>`
  })
  const critLine = data.limits.rowsRead * 0.8
  if (critLine <= top) out += `<line x1="${padL}" y1="${y(critLine)}" x2="${W - padR}" y2="${y(critLine)}" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4" opacity=".85"/>`
  vals.forEach((v, i) => {
    const cx = padL + (iw * (i + 0.5)) / vals.length
    const h = Math.max(2, padT + ih - y(v))
    const ratio = v / (Number(data.limits.rowsRead) || 5_000_000), over = ratio >= 0.5
    const tipHtml = `<b>${esc(data.days[i])}</b><br>${monNum(v)} 行 · 占额度 ${monPct(ratio)}`
    out += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${over ? '#f59e0b' : '#93c5fd'}" opacity="${over ? 0.95 : 0.9}" data-tip="${esc(tipHtml)}"></rect>`
    out += `<text x="${cx.toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="9.5" fill="#94a3b8">${esc(labels[i])}</text>`
    if (over) out += `<text x="${cx.toFixed(1)}" y="${(y(v) - 5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#d97706">${monPct(ratio)}</text>`
  })
  return out + '</svg>'
}
function monRenderCharts(data) {
  const trend = document.getElementById('mon-trend')
  if (!trend) return
  trend.innerHTML = monTrendSvg(data)
  const bars = document.getElementById('mon-bars')
  if (bars) bars.innerHTML = monBarSvg(data)
  const leg = document.getElementById('mon-legend')
  if (leg) leg.innerHTML = MON_DEFS.map((d) => `<span class="item" style="${monState.filter !== 'all' && monState.filter !== d.key ? 'opacity:.35' : ''}"><span class="sw" style="background:${d.color}"></span>${esc(d.name)}</span>`).join('') + '<span class="item muted">点击节点看当日占比</span>'
  document.querySelectorAll('#mon-metric-seg button').forEach((b) => b.classList.toggle('active', b.dataset.m === monState.filter))
}
function monRenderTable(data) {
  const box = document.getElementById('mon-table')
  if (!box) return
  box.innerHTML = data.metrics.map((m) => {
    const lv = monLevel(m.ratio)
    return `<div class="card item-card" style="margin-bottom:9px">
      <div class="item-top"><div class="item-main"><div class="item-title" style="font-size:13px">${esc(m.name)}</div>
        <div class="item-sub">当前 ${monFmt(m.key, m.current)} / 上限 ${monLimit(m.key, m.limit)}</div></div>
        <span class="badge ${MON_LEVEL_BADGE[lv]}">${MON_LEVEL_TXT[lv]}</span></div>
      <div style="margin-top:9px;font-size:12px;color:var(--t2)"><span class="mon-track"><span class="mon-fill" style="width:${Math.min(100, m.ratio * 100).toFixed(1)}%;background:${MON_LEVEL_COLOR[lv]}"></span></span><b>${monPct(m.ratio)}</b></div>
      <div class="item-meta"><span>昨日 <b>${m.yesterday == null ? '—' : monPct(m.yesterday / m.limit)}</b></span>
        <span>近 ${data.days.length} 日峰值 <b>${m.peak ? monPct(m.peak.ratio) + '（' + fmtDay(m.peak.date) + '）' : '—'}</b></span></div></div>`
  }).join('')
}
function monRenderAccount(data) {
  const box = document.getElementById('mon-account')
  if (!box) return
  const a = data.account || {}
  const peakRead = (data.metrics.find((m) => m.key === 'rowsRead') || {}).peak
  let rows = (a.workers || []).slice(0, 4).map((w) => `<div class="kv-row"><span class="k">${esc(w.name)} 今日请求</span><span class="v">${monNum(w.requests)} 次</span></div>`)
  if (!rows.length) rows = ['<div class="kv-row"><span class="k">Worker 今日请求</span><span class="v">无数据</span></div>']
  rows.push(`<div class="kv-row"><span class="k">D1 数据库</span><span class="v">${monNum(a.d1Databases)} 个 · ${monBytes(a.storageBytes)}</span></div>`)
  rows.push(`<div class="kv-row"><span class="k">今日 Worker 错误请求</span><span class="v">${monNum(a.errorsToday)} 次</span></div>`)
  rows.push(`<div class="kv-row"><span class="k">近 ${data.days.length} 日最高单日读取</span><span class="v">${peakRead ? monNum(peakRead.value) + ' 行（' + fmtDay(peakRead.date) + '）' : '—'}</span></div>`)
  box.innerHTML = rows.join('')
}
function monRenderNotes(data) {
  const box = document.getElementById('mon-notes')
  if (!box) return
  const notes = (data.notes || []).map((n) => '<div>· ' + esc(n) + '</div>').join('')
  box.innerHTML = '<div>数据来源：' + esc(data.source || 'Cloudflare GraphQL Analytics API') + ' · 服务端取数，无需 VPN · 日额度按 UTC 00:00（北京 08:00）重置</div>' + notes
}
function monRenderAll(data) {
  monRenderBanner(data); monRenderKpis(data); monRenderCharts(data)
  monRenderTable(data); monRenderAccount(data); monRenderNotes(data)
  const el = document.getElementById('mon-updated')
  if (el) el.textContent = '最后更新 ' + monBjTime(monState.lastAt || new Date(data.generatedAt)) + '（北京）'
}
function monCheckAlert(data) {
  const hits = data.metrics.filter((m) => m.ratio >= 0.8)
  if (!hits.length) return
  const sig = data.todayUtc + '|' + hits.map((m) => m.key).sort().join(',')
  try { if (localStorage.getItem(MON_ALERT_KEY) === sig) return } catch { /* 隐私模式 */ }
  try { localStorage.setItem(MON_ALERT_KEY, sig) } catch { /* 忽略 */ }
  const rows = hits.map((m) => `<div class="mon-alert-row"><span>${esc(m.name)} · 当前 UTC 日</span><span class="v">${monPct(m.ratio)}（${monFmt(m.key, m.current)} / ${monLimit(m.key, m.limit)}）</span></div>`).join('')
  const el = openSheet('服务额度告警', `<div class="mon-hero"><div class="t">免费版额度已使用超过 80%</div>
      <div class="d">继续增长将触发硬限制：Workers 返回 Error 1027，D1 查询直接报错，用户端同步与登录可能失败，且不会自动扣费续命。</div></div>
    ${rows}<div class="mon-note"><b>建议处置</b><br/>1. 升级 Cloudflare Workers Paid（$5/月起），通常几分钟内解除每日硬限制。<br/>
    2. 短期降载：给 <b>analytics_events(source, ts)</b> 加复合索引、限制激活码列表全表扫描。<br/>
    3. 日额度于 UTC 00:00（北京 08:00）重置，重置前请留意剩余窗口。</div>`,
    `<button class="btn" type="button" id="mon-alert-ok">知道了</button><button class="btn btn-primary" type="button" id="mon-alert-refresh">立即重新检测</button>`)
  el.querySelector('#mon-alert-ok').onclick = closeSheet
  el.querySelector('#mon-alert-refresh').onclick = () => { closeSheet(); monLoad(document.getElementById('mon-refresh')) }
}
async function monLoad(btn, silent) {
  if (monState.loading) return
  monState.loading = true
  if (btn) { btn.disabled = true; btn.textContent = '正在读取最新数据…' }
  try {
    const data = await api('/api/admin/usage?t=' + Date.now())
    if (!data || !Array.isArray(data.metrics)) throw new Error('接口返回数据不完整')
    monState.data = data; monState.lastAt = new Date()
    monRenderAll(data); monCheckAlert(data)
    if (!silent) toast('已读取 Cloudflare 最新用量数据')
  } catch (e) {
    const box = document.getElementById('mon-banner')
    if (box) {
      box.className = 'mon-banner crit'
      box.innerHTML = MON_WARN_ICON + '<div><span class="b-title">用量数据读取失败</span><span class="b-sub">' +
        esc(e.message || '未知错误') + ' · 可稍后重试，若持续失败请检查服务端 CF_API_TOKEN 配置</span></div>'
    }
    toast('用量数据读取失败：' + (e.message || '未知错误'), 'err')
  } finally {
    monState.loading = false
    if (btn) { btn.disabled = false; btn.textContent = '刷新数据' }
  }
}
async function renderMonitor() {
  shell('服务监控', 'Cloudflare 免费版额度实时巡检', `<div class="page-head"><div><h1>服务监控</h1>
      <div class="sub">日额度按 UTC 00:00（北京 08:00）重置 · 每 5 分钟自动刷新</div></div></div>
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" type="button" id="mon-refresh">刷新数据</button>
      <span class="muted" id="mon-updated" style="font-size:11px">—</span></div>
    <div id="mon-banner" class="mon-banner ok">${MON_OK_ICON}<div><span class="b-title">正在读取用量数据…</span><span class="b-sub">首次加载会实时向 Cloudflare 取数</span></div></div>
    <div id="mon-kpis" class="mon-kpi-grid"></div>
    <div class="card card-pad" style="margin-bottom:10px"><div class="card-title">额度占用趋势 <span class="hint">占当日免费额度百分比</span></div>
      <div class="seg" id="mon-metric-seg" style="margin:4px 0 10px">
        ${[['all', '全部'], ['requests', '请求'], ['rowsRead', 'D1 读'], ['rowsWritten', 'D1 写'], ['storageBytes', '存储']].map(([v, l]) => `<button type="button" data-m="${v}" class="${monState.filter === v ? 'active' : ''}">${l}</button>`).join('')}</div>
      <div class="chart-box" id="mon-trend"></div><div class="legend" id="mon-legend"></div></div>
    <div class="card card-pad" style="margin-bottom:10px"><div class="card-title">D1 读取行数 <span class="hint">红线为 80% 告警线</span></div>
      <div class="chart-box" id="mon-bars"></div>
      <div class="legend"><span class="item"><span class="sw" style="background:#f59e0b"></span>达到 50% 的日期</span><span class="item muted">日上限 500 万行 · 80% = 400 万行</span></div></div>
    <div class="section-title">额度明细</div><div id="mon-table"></div>
    <div class="section-title">账户构成</div><div class="card card-pad" id="mon-account"></div>
    <div class="section-title">告警规则</div><div class="card card-pad">
      <div class="mon-rule"><span class="k" style="color:var(--amber)">≥ 50%</span>标记「注意」：状态横幅与对应卡片转橙，不打断操作。</div>
      <div class="mon-rule"><span class="k" style="color:var(--red)">≥ 80%</span>自动弹出告警弹窗，列出越限指标、影响范围与处置建议。</div>
      <div class="mon-rule"><span class="k muted">去重</span>同一 UTC 日、同一组越限指标只弹一次。</div></div>
    <div class="form-tip" id="mon-notes" style="margin-top:12px;line-height:1.8"></div>`)
  const btn = document.getElementById('mon-refresh')
  btn.onclick = () => monLoad(btn)
  document.getElementById('mon-metric-seg').onclick = (e) => {
    const b = e.target.closest('button')
    if (!b) return
    monState.filter = b.dataset.m
    if (monState.data) monRenderCharts(monState.data)
  }
  if (monState.timer) clearInterval(monState.timer)
  monState.timer = setInterval(() => {
    if (location.hash === '#/monitor' && !document.hidden) monLoad(null, true)
  }, 5 * 60_000)
  if (monState.data) monRenderAll(monState.data)
  monLoad(btn, true)
}

// ---------- 启动 ----------
// token 校验用轻量 ping,不再跑 overview 的整套 D1 聚合(降 D1 读取)。
;(async function init() {
  if (localStorage.getItem(TOKEN_KEY)) {
    try { await api('/api/admin/ping') }
    catch { localStorage.removeItem(TOKEN_KEY) }
  }
  render()
})()
let _lastTokenCheck = Date.now()
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !localStorage.getItem(TOKEN_KEY) || location.hash === '#/login') return
  if (Date.now() - _lastTokenCheck < 5 * 60_000) return
  _lastTokenCheck = Date.now()
  api('/api/admin/ping').catch(() => {})
})
</script>
